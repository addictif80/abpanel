[program:abpanel-queue]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/abpanel/artisan queue:work database --sleep=3 --tries=3 --max-time=3600
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=2
redirect_stderr=true
stdout_logfile=/var/log/supervisor/abpanel-queue.log
stopwaitsecs=3600

[program:abpanel-scheduler]
; Runs Laravel's scheduler loop (routes/console.php), required for the
; vm:sync-tailscale safety-net sync and reminders:send.
process_name=%(program_name)s
command=php /var/www/abpanel/artisan schedule:work
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=1
redirect_stderr=true
stdout_logfile=/var/log/supervisor/abpanel-scheduler.log
